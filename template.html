<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Links</title>
<style>
  :root {
    --bg: #f6f3ee;
    --card: #ffffff;
    --text: #1d1b19;
    --muted: #6b655e;
    --accent: #b08d57;
    --border: #e6e0d7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141312;
      --card: #1f1d1b;
      --text: #f2eee8;
      --muted: #a39b91;
      --accent: #d4b07a;
      --border: #2f2c29;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  .logo {
    width: 88px; height: 88px; margin: 0 auto 16px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: grid; place-items: center;
    font-size: 32px; font-weight: 700; letter-spacing: 1px;
  }
  h1 { margin: 0 0 4px; font-size: 26px; }
  p.sub { margin: 0 0 32px; color: var(--muted); }
  nav { display: flex; flex-direction: column; gap: 14px; }
  a.btn {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--text);
    text-decoration: none;
    font-size: 17px; font-weight: 600;
    transition: transform .15s, border-color .15s;
  }
  a.btn:hover, a.btn:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
  a.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  a.btn svg { width: 24px; height: 24px; flex: none; }
  a.btn span { flex: 1; text-align: center; margin-left: 24px; }
  footer { margin-top: 40px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <div class="logo" id="logo"></div>
  <h1 id="name"></h1>
  <p class="sub" id="sub"></p>
  <nav id="nav"></nav>
  <footer id="foot"></footer>
</main>
<script>
const I={
 g:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.6 7L12 17.5 5.8 21.2l1.6-7L2 9.5l7.1-.6z"/></svg>',
 w:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>',
 i:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>',
 f:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 8h3V4h-3c-2.8 0-4.5 1.7-4.5 4.5V11H7v4h2.5v7h4v-7H17l.5-4h-4V8.8c0-.5.3-.8.5-.8z"/></svg>',
 t:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 3c.4 2.3 1.9 3.8 4 4v3.4c-1.5 0-2.9-.5-4-1.2V15a6 6 0 1 1-6-6h.5v3.5a2.5 2.5 0 1 0 2 2.5V3z"/></svg>'};
let d=window.D||{};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=d.n||'';document.title=n||'Links';
document.getElementById('name').textContent=n;
document.getElementById('sub').textContent=d.s||'';
document.getElementById('foot').textContent=n?'\u00a9 '+n:'';
document.getElementById('logo').textContent=n.trim().split(/\s+/).slice(0,2).map(w=>[...w][0]).join('').toUpperCase();
const L=[];
if(d.p)L.push(['g','https://search.google.com/local/writereview?placeid='+encodeURIComponent(d.p),'השאירו ביקורת בגוגל',1]);
else if(d.q)L.push(['g','https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(d.q),'השאירו ביקורת בגוגל',1]);
if(d.w)L.push(['w',/^https?:/.test(d.w)?d.w:'https://'+d.w,'האתר שלנו']);
if(d.i)L.push(['i','https://www.instagram.com/'+encodeURIComponent(d.i)+'/','Instagram']);
if(d.f)L.push(['f','https://www.facebook.com/'+encodeURIComponent(d.f),'Facebook']);
if(d.t)L.push(['t','https://www.tiktok.com/@'+encodeURIComponent(d.t),'TikTok']);
document.getElementById('nav').innerHTML=L.map(([k,h,l,p])=>`<a class="btn${p?' primary':''}" href="${esc(h)}" target="_blank" rel="noopener">${I[k]}<span>${l}</span></a>`).join('');
if(!n)document.getElementById('name').textContent='—';
</script>
</body>
</html>
